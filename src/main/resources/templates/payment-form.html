
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; }
        header { background: #0f766e; color: white; padding: 24px 8%; }
        header h1 { margin: 0 0 8px; }
        header p { margin: 0; color: #ccfbf1; }
        main { max-width: 700px; margin: 35px auto; padding: 0 20px; }
        .card { background: white; padding: 28px; border-radius: 14px; border-top: 4px solid #0f766e; box-shadow: 0 4px 12px #0000000a; }
        label { display: block; font-weight: bold; margin: 16px 0 7px; }
        input, select { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        .btn { display: inline-block; margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 8px; background: #0f766e; color: white; text-decoration: none; cursor: pointer; }
        .secondary { background: #475569; }
        footer { text-align: center; padding: 25px; color: #64748b; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${payment.paymentId == null ? 'Record Payment' : 'Edit Payment'}">Payment Form</h1>
    <p>Enter the payment details.</p>
</header>

<main>
    <section class="card">
        <form action="/payments/save" method="post">
            <input type="hidden" name="paymentId" th:value="${payment.paymentId}">

            <label for="billId">Bill</label>
            <select id="billId" name="billId" required>
                <option value="">Select Bill</option>
                <option th:each="bill : ${bills}"
                        th:value="${bill.billId}"
                        th:text="${'Bill #' + bill.billId + ' - ₹' + bill.totalAmount + ' (' + bill.status + ')'}"
                        th:selected="${payment.billId != null and payment.billId == bill.billId}">
                </option>
            </select>

            <label for="paymentDate">Payment Date</label>
            <input id="paymentDate" type="date" name="paymentDate"
                   th:value="${payment.paymentDate}" required>

            <label for="amount">Amount (₹)</label>
            <input id="amount" type="number" name="amount"
                   min="0.01" step="0.01" th:value="${payment.amount}" required>

            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod" name="paymentMethod" required>
                <option value="">Select Method</option>
                <option th:each="method : ${methods}"
                        th:value="${method}"
                        th:text="${method}"
                        th:selected="${payment.paymentMethod == method}">
                </option>
            </select>

            <button class="btn" type="submit">Save Payment</button>
            <a class="btn secondary" href="/payments">Cancel</a>
        </form>
    </section>
</main>

<footer>Hospital Management System</footer>
</body>
</html>
