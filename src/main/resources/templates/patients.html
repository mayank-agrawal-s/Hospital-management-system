
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Hospital Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0001;
        }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        h1 { color: #17365d; margin: 0; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dashboard-button, .add-button, .edit-link, .delete-button {
            display: inline-block; padding: 9px 13px; border-radius: 5px; text-decoration: none; cursor: pointer; font-size: 14px; border: none; font-family: inherit;
        }
        .dashboard-button { background: #e5eaf1; color: #222; }
        .add-button { background: #176b55; color: white; }
        .table-wrap { overflow-x: auto; background: white; padding: 20px 0 0; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #17365d; color: white; }
        tr:hover { background: #f8fafc; }
        .edit-link { background: #e5efff; color: #174ea6; }
        .delete-button { background: #b42318; color: white; }
        .empty { padding: 20px; color: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <div class="top">
        <h1>Hospital Patient Records</h1>
        <div class="top-actions">
            <a class="dashboard-button" href="/">Dashboard</a>
            <a class="add-button" href="/patients/new">+ Add New Patient</a>
        </div>
    </div>
    <p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: green; font-weight: bold;">
</p>
    <p>Patient information retrieved from the hospital database.</p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Gender</th>
<th>Date of Birth</th>
<th>Action</th>

            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.patientId}"></td>
                <td th:text="${patient.patientName}"></td>
                <td th:text="${patient.phone}"></td>
                <td th:text="${patient.email}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.dateOfBirth}"></td>


<td>
    <a class="edit-link" th:href="@{/patients/edit/{id}(id=${patient.patientId})}">Edit</a>

    <form th:action="@{/patients/delete/{id}(id=${patient.patientId})}"
          method="post"
          style="display:inline;"
          onsubmit="return confirm('Are you sure you want to delete this patient?');">
        <button type="submit" class="delete-button">Delete</button>
    </form>
</td>


            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="7" class="empty">No patient records found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
