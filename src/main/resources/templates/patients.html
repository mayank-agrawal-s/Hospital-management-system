
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Hospital Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        h1 { color: #0f766e; }
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0f766e;
            text-decoration: none;
        }
        .table-wrap {
            overflow-x: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #0f766e;
            color: white;
        }
        tr:hover { background: #f8fafc; }
        .empty { padding: 20px; color: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="/">← Back to Dashboard</a>
    <a href="/patients/new"
   style="display:inline-block; padding:10px 16px; background:#0f766e; color:white; text-decoration:none; border-radius:6px; margin-bottom:15px;">
   + Add New Patient
</a>
    <h1>Hospital Patient Records</h1>
    <p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: green; font-weight: bold;">
</p>
    <p>Patient information retrieved from the hospital database.</p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Gender</th>
<th>Date of Birth</th>
<th>Action</th>

            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.patientId}"></td>
                <td th:text="${patient.patientName}"></td>
                <td th:text="${patient.phone}"></td>
                <td th:text="${patient.email}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.dateOfBirth}"></td>


<td>
    <a th:href="@{/patients/edit/{id}(id=${patient.patientId})}"
       style="color:#0f766e; font-weight:bold; text-decoration:none;">
        Edit
    </a>

    <form th:action="@{/patients/delete/{id}(id=${patient.patientId})}"
          method="post"
          style="display:inline;"
          onsubmit="return confirm('Are you sure you want to delete this patient?');">
        <button type="submit"
                style="margin-left:10px; padding:6px 10px; background:#dc2626; color:white; border:none; border-radius:5px; cursor:pointer;">
            Delete
        </button>
    </form>
</td>


            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="7" class="empty">No patient records found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
