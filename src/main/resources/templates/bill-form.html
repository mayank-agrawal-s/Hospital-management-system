
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; }
        header { background: #0f766e; color: white; padding: 24px 8%; }
        header h1 { margin: 0 0 8px; }
        header p { margin: 0; color: #ccfbf1; }
        main { max-width: 700px; margin: 35px auto; padding: 0 20px; }
        .card { background: white; padding: 28px; border-radius: 14px; border-top: 4px solid #0f766e; box-shadow: 0 4px 12px #0000000a; }
        label { display: block; font-weight: bold; margin: 16px 0 7px; }
        input, select { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        .btn { display: inline-block; margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 8px; background: #0f766e; color: white; text-decoration: none; cursor: pointer; }
        .secondary { background: #475569; }
        footer { text-align: center; padding: 25px; color: #64748b; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${bill.billId == null ? 'Create Bill' : 'Edit Bill'}">Bill Form</h1>
    <p>Enter the patient billing details.</p>
</header>

<main>
    <section class="card">
        <form action="/bills/save" method="post">
            <input type="hidden" name="billId" th:value="${bill.billId}">

            <label for="patientId">Patient</label>
            <select id="patientId" name="patientId" required>
                <option value="">Select Patient</option>
                <option th:each="patient : ${patients}"
                        th:value="${patient.patientId}"
                        th:text="${patient.patientId + ' - ' + patient.patientName}"
                        th:selected="${bill.patientId != null and bill.patientId == patient.patientId}">
                </option>
            </select>

            <label for="appointmentId">Appointment (optional)</label>
            <select id="appointmentId" name="appointmentId">
                <option value="">No Appointment</option>
                <option th:each="appointment : ${appointments}"
                        th:value="${appointment.appointmentId}"
                        th:text="${'Appointment #' + appointment.appointmentId + ' - Patient #' + appointment.patientId + ' - ' + appointment.appointmentDate}"
                        th:selected="${bill.appointmentId != null and bill.appointmentId == appointment.appointmentId}">
                </option>
            </select>

            <label for="billDate">Bill Date</label>
            <input id="billDate" type="date" name="billDate"
                   th:value="${bill.billDate}" required>

            <label for="totalAmount">Total Amount (₹)</label>
            <input id="totalAmount" type="number" name="totalAmount"
                   min="0" step="0.01" th:value="${bill.totalAmount}" required>

            <button class="btn" type="submit">Save Bill</button>
            <a class="btn secondary" href="/bills">Cancel</a>
        </form>
    </section>
</main>

<footer>Hospital Management System</footer>
</body>
</html>
